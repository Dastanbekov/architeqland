version: "3.8"

services:
  traefik:
    image: "traefik:latest"
    container_name: "traefik"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=dastanbekov@architeq.tech"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - architeq_network

  db:
    image: postgres:16-alpine
    container_name: architeq_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-architeq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-architeq_pass}
      POSTGRES_DB: ${POSTGRES_DB:-architeq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - architeq_network

  redis:
    image: redis:7-alpine
    container_name: architeq_redis
    restart: always
    networks:
      - architeq_network

  orchestrator:
    build: 
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: "architeq_orchestrator"
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-architeq}
      - DB_USER=${POSTGRES_USER:-architeq}
      - DB_PASS=${POSTGRES_PASSWORD:-architeq_pass}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key-change-in-prod}
      - REDIS_HOST=redis
      - GH_TOKEN=${GH_TOKEN}
      - GITHUB_ORG=${GITHUB_ORG:-Dastanbekov}
      - SANDBOX_DOMAIN=${SANDBOX_DOMAIN:-sandbox.architeq.tech}
      - SANDBOX_BASE_DIR=/sandboxes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandboxes:/sandboxes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`api.architeq.tech`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls.certresolver=myresolver"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
    networks:
      - architeq_network

volumes:
  postgres_data:

networks:
  architeq_network:
    name: architeq_network
    driver: bridge
